<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MadKick — Procedural VFX Audiovisual Experience</title>
    <meta name="description" content="A mind-bending procedural VFX audiovisual experience driven by a 170 BPM kick drum with continuous modulation. Real-time frequency analysis meets generative art.">
    <meta name="version" content="1.0.5">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- VFX Canvas Layers -->
    <canvas id="vfxCanvas"></canvas>
    <canvas id="glitchCanvas"></canvas>

    <!-- Beat-synced brutalist typography -->
    <div id="beatType" class="beat-type" aria-hidden="true"></div>

    <!-- Live VJ status readout -->
    <div id="vjStatus" class="vj-status" aria-hidden="true"></div>

    <!-- Overlay UI -->
    <div id="overlay" class="overlay">
        <div id="hud-top" class="hud hud-top">
            <div class="hud-label">FREQ</div>
            <div id="hud-freq" class="hud-value">---</div>
            <div class="hud-separator"></div>
            <div class="hud-label">BPM</div>
            <div id="hud-bpm" class="hud-value">170</div>
            <div class="hud-separator"></div>
            <div class="hud-label">RMS</div>
            <div id="hud-rms" class="hud-value">0.00</div>
        </div>

        <div id="startScreen" class="start-screen">
            <div class="logo-container">
                <div class="logo-ring ring-outer"></div>
                <div class="logo-ring ring-middle"></div>
                <div class="logo-ring ring-inner"></div>
                <button id="playButton" type="button" class="play-btn" aria-label="Start Experience">
                    <svg viewBox="0 0 100 100" class="play-icon">
                        <polygon points="30,20 30,80 80,50" fill="currentColor"/>
                    </svg>
                </button>
            </div>
            <h1 class="title">MADKICK</h1>
            <p class="subtitle">170 BPM · CONTINUOUS MODULATION · PROCEDURAL VFX</p>
        </div>

        <div id="hud-bottom" class="hud hud-bottom">
            <div id="spectrumBar" class="spectrum-bar"></div>
        </div>
    </div>

    <audio id="audioPlayer" loop preload="auto">
        <source src="kick.mp3" type="audio/mp3">
    </audio>

    <script type="module" src="app.js"></script>
</body>

</html>
