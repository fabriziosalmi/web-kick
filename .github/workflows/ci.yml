name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax-check JavaScript (app + modules)
        run: |
          node --check app.js
          for f in modules/*.js; do
            echo "checking $f"
            node --check "$f"
          done

      - name: Verify entry points exist
        run: |
          test -f index.html
          test -f styles.css
